<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="titulo">
  <title id="titulo">Luiz Guilherme dos Santos</title>
  <defs>
    <pattern id="grade" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#DDD6C6"/>
    </pattern>
    <linearGradient id="esmaece" x1="0" x2="1">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mascara"><rect width="1200" height="300" fill="url(#esmaece)"/></mask>
    <linearGradient id="onda" x1="610" x2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C27417" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#C27417"/>
    </linearGradient>
  </defs>
  <style>
    .barra { fill: url(#onda); transform-box: fill-box; transform-origin: center;
             animation: respira 1.8s ease-in-out infinite alternate; }
    .trilha { fill: none; stroke: #13877A; stroke-width: 2.5; stroke-linejoin: round; }
    .trilha circle { fill: #F6F3EC; }
    .trilha .cheio { fill: #13877A; stroke: none; }
    .pulso { fill: none; stroke: #C27417; stroke-width: 3; stroke-linecap: round;
             stroke-dasharray: 14 600; stroke-dashoffset: 614; animation: corre 3.6s linear infinite; }
    @keyframes respira { from { transform: scaleY(0.55); } to { transform: scaleY(1); } }
    @keyframes corre { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .barra { animation: none; } .pulso { display: none; } }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="#F6F3EC" stroke="#E4DED1"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="url(#grade)" mask="url(#mascara)"/>

  <text x="64" y="70" fill="#C27417" font-family="'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2">DESENVOLVIMENTO · AUTOMAÇÃO · IA ASSISTIVA</text>
  <text x="62" y="136" fill="#18202C" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1">Luiz Guilherme</text>
  <text x="62" y="200" fill="#18202C" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1">dos Santos</text>
  <text x="64" y="246" fill="#5F6B7A" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18">UFMT · Grupo Vivart · FATA · Cuiabá, MT</text>

